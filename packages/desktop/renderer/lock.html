<!DOCTYPE html>
<html lang="vi" data-theme="dark">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:;">
<title>FocusGate</title>
<link rel="stylesheet" href="styles.css">
<style>
  html, body { height: 100%; }
  body { display: grid; place-items: center; padding: 44px 24px; overflow-y: auto; -webkit-app-region: drag; }
  body::before { filter: blur(52px); }
  .wrap { width: 100%; max-width: 660px; -webkit-app-region: no-drag; }

  .brandbar { display: flex; align-items: center; gap: 10px; margin-bottom: 44px; }
  .brandbar .logo { width: 26px; height: 26px; border-radius: 8px; }
  .brandbar .logo svg { width: 13px; height: 13px; }
  .brandbar .name { font-size: 13px; font-weight: 620; letter-spacing: -.02em; }

  .hero { text-align: center; margin-bottom: 32px; }
  .lock {
    position: relative; width: 80px; height: 80px; margin: 0 auto 26px;
    border-radius: 23px; display: grid; place-items: center;
    background: var(--surface-2); border: 1px solid var(--danger-line); color: var(--danger);
    box-shadow: 0 0 54px -12px color-mix(in srgb, var(--danger) 75%, transparent), var(--hairline);
  }
  .lock::after {
    content: ''; position: absolute; inset: -8px; border-radius: 31px;
    border: 1px solid color-mix(in srgb, var(--danger) 22%, transparent);
    animation: ring 3.4s var(--ease) infinite;
  }
  @keyframes ring { 0%,100% { transform: scale(1); opacity: .8; } 50% { transform: scale(1.07); opacity: .22; } }
  .lock.open { border-color: color-mix(in srgb, var(--success) 42%, transparent); color: var(--success);
               box-shadow: 0 0 54px -12px color-mix(in srgb, var(--success) 75%, transparent), var(--hairline); }
  .lock.open::after { border-color: color-mix(in srgb, var(--success) 22%, transparent); }
  .lock svg { width: 31px; height: 31px; fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }

  h1 { font-size: 37px; line-height: 1.16; letter-spacing: -.045em; margin-bottom: 12px; }
  .sub { color: var(--text-2); font-size: 15px; max-width: 500px; margin: 0 auto; letter-spacing: -.01em; }
  .strip { display: flex; gap: 7px; justify-content: center; flex-wrap: wrap; margin-top: 20px; }

  .sec-head { display: flex; align-items: center; gap: 10px; margin: 26px 2px 11px; }
  .sec-head::after { content: ''; flex: 1; height: 1px; background: var(--border); }

  details.escape { margin-top: 32px; border-radius: var(--r-lg); border: 1px dashed var(--border-strong); overflow: hidden; }
  details.escape > summary {
    list-style: none; cursor: pointer; padding: 13px 17px; font-size: 12.5px; color: var(--muted);
    display: flex; align-items: center; gap: 9px; transition: color .15s var(--ease), background .15s var(--ease);
  }
  details.escape > summary::-webkit-details-marker { display: none; }
  details.escape > summary:hover { color: var(--text-2); background: var(--surface-2); }
  details.escape[open] > summary { border-bottom: 1px dashed var(--border-strong); color: var(--text-2); }
  .escape-body { padding: 18px; background: var(--bg-2); }
  .cost { background: var(--danger-soft); border: 1px solid var(--danger-line); border-radius: var(--r-sm); padding: 13px 15px; margin-bottom: 16px; }
  .cost ul { margin: 8px 0 0; padding-left: 18px; } .cost li { font-size: 12.5px; color: var(--text-2); margin: 4px 0; }
  .cost li::marker { color: var(--danger); }
  .phrase { font-size: 13.5px; line-height: 1.75; padding: 14px 16px; border-radius: var(--r-sm); color: var(--text-2);
            background: var(--surface-2); border: 1px solid var(--border); margin-bottom: 11px; user-select: none; }
  #typed { min-height: 92px; font-size: 13.5px; line-height: 1.75; }
  #typed.match { border-color: color-mix(in srgb, var(--success) 60%, transparent); box-shadow: 0 0 0 3px var(--success-soft); }
  .progress-line { display: flex; align-items: center; gap: 11px; margin: 11px 0 15px; font-size: 11.5px;
                   color: var(--muted); font-family: var(--mono); letter-spacing: -.015em; }

  .unlocked-banner { display: flex; align-items: center; gap: 15px; padding: 16px 18px; border-radius: var(--r-lg);
                     background: var(--warn-soft); border: 1px solid color-mix(in srgb, var(--warn) 32%, transparent); }
  .timer-num { font-family: var(--mono); font-size: 29px; font-weight: 600; letter-spacing: -.05em;
               font-variant-numeric: tabular-nums; color: var(--warn); }
  .foot { margin-top: 32px; text-align: center; font-size: 11.5px; color: var(--faint); }
</style>
</head>
<body>
<div class="wrap">
  <div class="brandbar">
    <div class="logo"><svg viewBox="0 0 24 24"><rect x="4" y="10" width="16" height="11" rx="2.6"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg></div>
    <span class="name">FocusGate</span>
    <span class="spacer"></span>
    <span class="eyebrow">Màn hình khoá</span>
  </div>

  <div class="hero">
    <div class="lock" id="lock"><svg id="lockIcon" viewBox="0 0 24 24"><rect x="4" y="10" width="16" height="11" rx="2.6"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg></div>
    <h1 id="headline">Đang kiểm tra…</h1>
    <p class="sub" id="subline"></p>
    <div class="strip" id="strip"></div>
  </div>

  <div id="unlocked"></div>

  <div class="sec-head"><h2 class="eyebrow" id="tasksHead">Việc cần xong trước</h2></div>
  <div class="stack" id="tasks"></div>

  <div class="card card-pad" style="margin-top:18px">
    <label for="quick">Thêm nhanh một việc</label>
    <div class="row">
      <input type="text" id="quick" class="grow" placeholder="VD: Làm xong bài tập Giải tích chương 3" maxlength="200">
      <button class="btn btn-primary" id="quickAdd">Thêm</button>
    </div>
  </div>

  <details class="escape" id="escape">
    <summary>
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 9v4M12 17h.01M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0Z"/></svg>
      Tôi thực sự cần thoát khẩn cấp
    </summary>
    <div class="escape-body" id="escapeBody"></div>
  </details>

  <div class="foot">Màn hình này đóng lại khi việc bắt buộc đã xong.</div>
</div>
<script src="lock.js"></script>
</body>
</html>
