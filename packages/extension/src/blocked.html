<!DOCTYPE html>
<html lang="vi" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FocusGate — Việc trước đã</title>
<link rel="stylesheet" href="styles.css">
<link rel="icon" href="../icons/icon32.png">
<style>
  body { min-height: 100vh; display: grid; place-items: start center; padding: 34px 20px 90px; }
  .wrap { width: 100%; max-width: 620px; }

  /* --- Thanh thương hiệu --- */
  .brandbar { display: flex; align-items: center; gap: 10px; margin-bottom: 54px; }
  .brandbar .logo { width: 26px; height: 26px; border-radius: 8px; }
  .brandbar .logo svg { width: 13px; height: 13px; }
  .brandbar .name { font-size: 13px; font-weight: 620; letter-spacing: -.02em; }

  /* --- Ổ khoá --- */
  .hero { text-align: center; margin-bottom: 30px; }
  .lock {
    position: relative; width: 72px; height: 72px; margin: 0 auto 24px;
    border-radius: 20px; display: grid; place-items: center;
    background: var(--surface-2);
    border: 1px solid var(--danger-line);
    color: var(--danger);
    box-shadow: 0 0 40px -10px color-mix(in srgb, var(--danger) 70%, transparent), var(--hairline);
  }
  .lock::after {
    content: ''; position: absolute; inset: -7px; border-radius: 27px;
    border: 1px solid color-mix(in srgb, var(--danger) 22%, transparent);
    animation: ring 3.4s var(--ease) infinite;
  }
  @keyframes ring {
    0%, 100% { transform: scale(1);    opacity: .8; }
    50%      { transform: scale(1.07); opacity: .25; }
  }
  .lock.open { border-color: color-mix(in srgb, var(--success) 40%, transparent); color: var(--success);
               box-shadow: 0 0 40px -10px color-mix(in srgb, var(--success) 70%, transparent), var(--hairline); }
  .lock.open::after { border-color: color-mix(in srgb, var(--success) 22%, transparent); }
  .lock svg { width: 28px; height: 28px; fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }

  h1 { font-size: 33px; line-height: 1.18; letter-spacing: -.042em; margin-bottom: 11px; }
  .sub { color: var(--text-2); font-size: 14.5px; max-width: 480px; margin: 0 auto; letter-spacing: -.01em; }

  .attempt {
    display: inline-flex; align-items: center; gap: 9px; margin-top: 18px; max-width: 100%;
    padding: 6px 13px 6px 10px; border-radius: 999px;
    background: var(--surface-2); border: 1px solid var(--border);
    font-size: 11.5px; color: var(--muted); box-shadow: var(--hairline);
  }
  .attempt svg { flex: none; color: var(--danger); }
  .attempt b { font-family: var(--mono); font-size: 11.5px; font-weight: 600; color: var(--text-2);
               letter-spacing: -.02em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  .strip { display: flex; gap: 7px; justify-content: center; flex-wrap: wrap; margin-top: 20px; }

  /* --- Mục --- */
  section { margin-top: 26px; }
  .sec-head { display: flex; align-items: center; gap: 10px; margin-bottom: 11px; padding: 0 2px; }
  .sec-head::after { content: ''; flex: 1; height: 1px; background: var(--border); }
  .sec-head .eyebrow { flex: none; }
  .sec-head .btn { flex: none; order: 3; }

  /* --- Đồng hồ Pomodoro --- */
  .timer-card { display: flex; align-items: center; gap: 16px; padding: 16px 18px; }
  .timer-num {
    font-family: var(--mono); font-size: 32px; font-weight: 600;
    letter-spacing: -.05em; font-variant-numeric: tabular-nums; line-height: 1;
    background: var(--grad-text); -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  /* --- Lối thoát khẩn cấp --- */
  details.escape {
    margin-top: 34px; border-radius: var(--r-lg);
    border: 1px dashed var(--border-strong); overflow: hidden;
  }
  details.escape > summary {
    list-style: none; cursor: pointer; padding: 13px 17px;
    font-size: 12.5px; color: var(--muted);
    display: flex; align-items: center; gap: 9px;
    transition: color .15s var(--ease), background .15s var(--ease);
  }
  details.escape > summary::-webkit-details-marker { display: none; }
  details.escape > summary:hover { color: var(--text-2); background: var(--surface-2); }
  details.escape[open] > summary { border-bottom: 1px dashed var(--border-strong); color: var(--text-2); }
  .escape-body { padding: 18px; background: var(--bg-2); }
  .cost {
    background: var(--danger-soft); border: 1px solid var(--danger-line);
    border-radius: var(--r-sm); padding: 13px 15px; margin-bottom: 16px;
  }
  .cost ul { margin: 8px 0 0; padding-left: 18px; }
  .cost li { font-size: 12.5px; color: var(--text-2); margin: 4px 0; }
  .cost li::marker { color: var(--danger); }
  .phrase {
    font-size: 13.5px; line-height: 1.75; padding: 14px 16px; margin-bottom: 11px;
    border-radius: var(--r-sm); color: var(--text-2);
    background: var(--surface-2); border: 1px solid var(--border);
    user-select: none; -webkit-user-select: none;
  }
  #typed { min-height: 92px; font-size: 13.5px; line-height: 1.75; }
  #typed.match { border-color: color-mix(in srgb, var(--success) 60%, transparent);
                 box-shadow: 0 0 0 3px var(--success-soft); }
  .progress-line { display: flex; align-items: center; gap: 11px; margin: 11px 0 15px;
                   font-size: 11.5px; color: var(--muted); font-family: var(--mono); letter-spacing: -.015em; }

  .unlocked-banner {
    display: flex; align-items: center; gap: 15px; padding: 16px 18px;
    background: var(--warn-soft); border: 1px solid color-mix(in srgb, var(--warn) 32%, transparent);
    border-radius: var(--r-lg);
  }
  .unlocked-banner .timer-num { -webkit-text-fill-color: var(--warn); background: none; font-size: 28px; }

  .foot { margin-top: 36px; text-align: center; font-size: 11.5px; color: var(--faint); letter-spacing: -.005em; }
</style>
</head>
<body>
<div class="wrap">
  <div class="brandbar">
    <div class="logo"><svg viewBox="0 0 24 24"><rect x="4" y="10" width="16" height="11" rx="2.6"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg></div>
    <span class="name">FocusGate</span>
    <span class="spacer"></span>
    <span class="eyebrow" id="brandState">Cổng tập trung</span>
  </div>

  <div class="hero">
    <div class="lock" id="lock">
      <svg id="lockIcon" viewBox="0 0 24 24"><rect x="4" y="10" width="16" height="11" rx="2.6"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>
    </div>
    <h1 id="headline">Đang kiểm tra…</h1>
    <p class="sub" id="subline"></p>
    <div class="attempt hidden" id="attempt">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
      <span>Vừa định mở</span><b id="attemptUrl"></b>
    </div>
    <div class="strip" id="strip"></div>
  </div>

  <div id="unlocked" class="hidden"></div>

  <section id="timerSec" class="hidden">
    <div class="sec-head"><h2 class="eyebrow">Đang tập trung</h2></div>
    <div class="card timer-card">
      <div class="timer-num" id="timerNum">25:00</div>
      <div class="grow">
        <div class="strong" id="timerLabel" style="font-size:13.5px">Phiên tập trung</div>
        <div class="tiny muted" id="timerTask" style="margin-bottom:8px"></div>
        <div class="bar"><i id="timerBar" style="width:0%"></i></div>
      </div>
      <div class="row">
        <button class="btn btn-sm" id="timerPause">Tạm dừng</button>
        <button class="btn btn-sm btn-ghost" id="timerStop">Dừng</button>
      </div>
    </div>
  </section>

  <section id="tasksSec">
    <div class="sec-head">
      <h2 class="eyebrow" id="tasksHead">Việc cần xong trước</h2>
      <button class="btn btn-sm btn-ghost" id="openDash">Bảng điều khiển →</button>
    </div>
    <div class="stack" id="tasks"></div>
  </section>

  <section id="quickSec">
    <div class="card card-pad">
      <label for="quickTitle">Thêm nhanh một việc</label>
      <div class="row">
        <input type="text" id="quickTitle" class="grow" placeholder="VD: Làm xong bài tập Giải tích chương 3" maxlength="200">
        <button class="btn btn-primary" id="quickAdd">Thêm</button>
      </div>
      <div class="tiny muted" style="margin-top:9px">Việc thêm ở đây mặc định là <b style="color:var(--text-2)">bắt buộc</b> — xong mới mở được các trang khác.</div>
    </div>
  </section>

  <details class="escape" id="escape">
    <summary>
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 9v4M12 17h.01M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0Z"/></svg>
      Tôi thực sự cần thoát khẩn cấp
    </summary>
    <div class="escape-body" id="escapeBody"></div>
  </details>

  <div class="foot">Cổng chỉ mở khi việc xong. Bạn tự đặt ra luật này cho chính mình.</div>
</div>
<script type="module" src="blocked.js"></script>
</body>
</html>
